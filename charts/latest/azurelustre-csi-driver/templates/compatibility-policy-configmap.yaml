{{- include "azurelustre.validateImagePolicies" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "azurelustre.fullname" . }}-compatibility-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: compatibility-policy
    {{- include "azurelustre.labels" . | nindent 4 }}
data:
  policy.yaml: |
    apiVersion: azurelustre.csi.azure.com/{{ .Values.compatibilityPolicy.schemaVersion }}
    kind: AzureLustreCompatibilityPolicy
    clientSetRevision: {{ .Values.compatibilityPolicy.clientSetRevision }}
    cacheTTLSeconds: {{ .Values.compatibilityPolicy.cacheTTLSeconds }}
    mountAdmission:
      enforce: {{ .Values.compatibilityPolicy.mountAdmission.enforce }}
    images:
      driver:
        jammy:
          desiredDigest: {{ .Values.compatibilityPolicy.images.driver.jammy.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.driver.jammy.approvedDigests | toJson }}
        noble:
          desiredDigest: {{ .Values.compatibilityPolicy.images.driver.noble.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.driver.noble.approvedDigests | toJson }}
        azurelinux3:
          desiredDigest: {{ .Values.compatibilityPolicy.images.driver.azurelinux3.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.driver.azurelinux3.approvedDigests | toJson }}
      loader:
        jammy:
          desiredDigest: {{ .Values.compatibilityPolicy.images.loader.jammy.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.loader.jammy.approvedDigests | toJson }}
        noble:
          desiredDigest: {{ .Values.compatibilityPolicy.images.loader.noble.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.loader.noble.approvedDigests | toJson }}
        azurelinux3:
          desiredDigest: {{ .Values.compatibilityPolicy.images.loader.azurelinux3.desiredDigest | quote }}
          approvedDigests: {{ .Values.compatibilityPolicy.images.loader.azurelinux3.approvedDigests | toJson }}
    clients:
      jammy:
        desired:
          version: {{ .Values.node.jammy.lustreClient.version | quote }}
          shaSuffix: {{ .Values.node.jammy.lustreClient.shaSuffix | quote }}
        compatible:
          - version: {{ .Values.node.jammy.lustreClient.version | quote }}
            shaSuffix: {{ .Values.node.jammy.lustreClient.shaSuffix | quote }}
          {{- range .Values.node.jammy.lustreClient.compatible }}
          - version: {{ .version | quote }}
            shaSuffix: {{ .shaSuffix | quote }}
          {{- end }}
      noble:
        desired:
          version: {{ .Values.node.noble.lustreClient.version | quote }}
          shaSuffix: {{ .Values.node.noble.lustreClient.shaSuffix | quote }}
        compatible:
          - version: {{ .Values.node.noble.lustreClient.version | quote }}
            shaSuffix: {{ .Values.node.noble.lustreClient.shaSuffix | quote }}
          {{- range .Values.node.noble.lustreClient.compatible }}
          - version: {{ .version | quote }}
            shaSuffix: {{ .shaSuffix | quote }}
          {{- end }}
      azurelinux3:
        desired:
          version: {{ .Values.node.azurelinux3.lustreClient.version | quote }}
          shaSuffix: {{ .Values.node.azurelinux3.lustreClient.shaSuffix | quote }}
        compatible:
          - version: {{ .Values.node.azurelinux3.lustreClient.version | quote }}
            shaSuffix: {{ .Values.node.azurelinux3.lustreClient.shaSuffix | quote }}
          {{- range .Values.node.azurelinux3.lustreClient.compatible }}
          - version: {{ .version | quote }}
            shaSuffix: {{ .shaSuffix | quote }}
          {{- end }}
    bootstrap:
      enabled: {{ .Values.compatibilityPolicy.bootstrap.enabled }}
      expiresAt: {{ .Values.compatibilityPolicy.bootstrap.expiresAt | quote }}
      csiImage:
        repository: {{ .Values.compatibilityPolicy.bootstrap.csiImage.repository | quote }}
        tag: {{ .Values.compatibilityPolicy.bootstrap.csiImage.tag | quote }}
        digest: {{ .Values.compatibilityPolicy.bootstrap.csiImage.digest | quote }}
