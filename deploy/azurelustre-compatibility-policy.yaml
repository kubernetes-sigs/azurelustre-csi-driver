---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-azurelustre-compatibility-policy
  namespace: kube-system
  labels:
    app.kubernetes.io/component: compatibility-policy
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: v0.6.0
data:
  policy.yaml: |
    apiVersion: azurelustre.csi.azure.com/v1alpha1
    kind: AzureLustreCompatibilityPolicy
    clientSetRevision: 1
    cacheTTLSeconds: 3600
    mountAdmission:
      enforce: false
    images:
      driver:
        jammy:
          desiredDigest: ""
          approvedDigests: []
        noble:
          desiredDigest: ""
          approvedDigests: []
        azurelinux3:
          desiredDigest: ""
          approvedDigests: []
      loader:
        jammy:
          desiredDigest: ""
          approvedDigests: []
        noble:
          desiredDigest: ""
          approvedDigests: []
        azurelinux3:
          desiredDigest: ""
          approvedDigests: []
    clients:
      jammy:
        desired:
          version: "2.15.8"
          shaSuffix: "39-g2d32b59"
        compatible:
          - version: "2.15.8"
            shaSuffix: "39-g2d32b59"
      noble:
        desired:
          version: "2.17.0"
          shaSuffix: "24-gf517bc4"
        compatible:
          - version: "2.17.0"
            shaSuffix: "24-gf517bc4"
      azurelinux3:
        desired:
          version: "2.17.0"
          shaSuffix: "24-gf517bc4"
        compatible:
          - version: "2.17.0"
            shaSuffix: "24-gf517bc4"
    bootstrap:
      enabled: false
      expiresAt: ""
      csiImage:
        repository: ""
        tag: ""
        digest: ""
