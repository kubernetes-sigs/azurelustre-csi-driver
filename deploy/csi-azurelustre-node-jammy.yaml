---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-azurelustre-node-jammy
  namespace: kube-system
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: latest
    app: csi-azurelustre-node
    flavor: jammy
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app: csi-azurelustre-node
      flavor: jammy
  template:
    metadata:
      labels:
        app: csi-azurelustre-node
        app.kubernetes.io/component: node
        app.kubernetes.io/name: azurelustre-csi-driver
        app.kubernetes.io/part-of: azurelustre-csi-driver
        app.kubernetes.io/version: latest
        flavor: jammy
    spec:
      hostNetwork: true
      dnsPolicy: Default
      serviceAccountName: csi-azurelustre-node-sa
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
                  - key: kubernetes.azure.com/os-sku-effective
                    operator: In
                    values:
                      - Ubuntu2204
                      - Ubuntu2004  # To support CVM nodes still on 20.04
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      initContainers:
        # Native sidecar (restartPolicy: Always): installs the Lustre client
        # kernel module for the running kernel, loads it into the shared host
        # kernel, configures LNet, then runs an LNet reconcile loop for the life
        # of the pod. Its startupProbe gates the driver and registrar containers
        # so they do not start until LNet is up (no registrar connect race); on
        # termination its SIGTERM handler unloads the modules so nothing is left
        # behind when the driver is uninstalled.
        - name: lustre-loader
          image: mcr.microsoft.com/oss/v2/kubernetes-csi/azurelustre-csi:latest-jammy
          imagePullPolicy: Always
          restartPolicy: Always
          securityContext:
            privileged: true
          startupProbe:
            failureThreshold: 120
            exec:
              command:
                - /app/readinessProbe.sh
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 5
          readinessProbe:
            failureThreshold: 5
            exec:
              command:
                - /app/readinessProbe.sh
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 30
          livenessProbe:
            failureThreshold: 5
            exec:
              command:
                # Restart the sidecar only when the Lustre kernel module has
                # vanished (unrecoverable in-process). Transient LNet config
                # drift is repaired by the reconcile loop and surfaced via the
                # readinessProbe, so it must not trigger a restart here.
                - /bin/sh
                - -c
                - "test -d /sys/module/lnet"
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
          env:
            - name: AZURELUSTRE_CSI_ROLE
              value: loader
            - name: LUSTRE_VERSION
              value: "2.15.8"
            - name: CLIENT_SHA_SUFFIX
              value: "34-gc0f2040"
          volumeMounts:
            - mountPath: /dev
              name: host-dev
            - mountPath: /etc/host-os-release
              name: host-os-release
            - mountPath: /app/custom-entrypoint
              name: custom-entrypoint
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 200Mi
            requests:
              cpu: 10m
              memory: 20Mi
      containers:
        - name: liveness-probe
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
          image: mcr.microsoft.com/oss/kubernetes-csi/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=120s
            - --health-port=29763
            - --v=2
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: node-driver-registrar
          image: mcr.microsoft.com/oss/kubernetes-csi/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=2
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            timeoutSeconds: 15
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/azurelustre.csi.azure.com/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: azurelustre
          image: mcr.microsoft.com/oss/v2/kubernetes-csi/azurelustre-csi:latest-jammy
          imagePullPolicy: Always
          args:
            - -v=5
            - --endpoint=$(CSI_ENDPOINT)
            - --nodeid=$(KUBE_NODE_NAME)
          ports:
            - containerPort: 29763
              name: healthz
              protocol: TCP
          # Reserved port for metrics
          # - containerPort: 29765
          #   name: metrics
          #   protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            # Gate Ready on the CSI socket existing: the driver installs its
            # userspace utils and only then execs and opens the socket (~18s on
            # Azure Linux), so without this the pod reports Ready before it can
            # serve mounts, letting a rolling upgrade advance past a node whose
            # driver is not serving yet.
            exec:
              command:
                - /bin/sh
                - -c
                - "test -S /csi/csi.sock"
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: AZURELUSTRE_CSI_ROLE
              value: driver
            - name: LUSTRE_VERSION
              value: "2.15.8"
            - name: CLIENT_SHA_SUFFIX
              value: "34-gc0f2040"
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /var/lib/kubelet/
              name: mountpoint-dir
              mountPropagation: Bidirectional
            - mountPath: /etc/kubernetes/
              name: azure-cred
            - mountPath: /dev
              name: host-dev
            - mountPath: /etc/host-os-release
              name: host-os-release
            - mountPath: /app/custom-entrypoint
              name: custom-entrypoint
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 200Mi
            requests:
              cpu: 10m
              memory: 20Mi
      volumes:
        - hostPath:
            path: /var/lib/kubelet/plugins/azurelustre.csi.azure.com
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
          name: registration-dir
        - hostPath:
            path: /var/lib/kubelet/
            type: Directory
          name: mountpoint-dir
        - hostPath:
            path: /etc/kubernetes/
            type: DirectoryOrCreate
          name: azure-cred
        - hostPath:
            path: /dev
            type: Directory
          name: host-dev
        - hostPath:
            path: /etc/os-release
            type: File
          name: host-os-release
        - name: custom-entrypoint
          configMap:
            name: csi-azurelustre-entrypoint
            defaultMode: 0755
            optional: true
