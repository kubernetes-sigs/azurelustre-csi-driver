---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-azurelustre-status-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/component: status-controller
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: v0.6.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csi-azurelustre-status-controller
      app.kubernetes.io/component: status-controller
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app: csi-azurelustre-status-controller
        app.kubernetes.io/component: status-controller
        app.kubernetes.io/name: azurelustre-csi-driver
        app.kubernetes.io/part-of: azurelustre-csi-driver
        app.kubernetes.io/version: v0.6.0
    spec:
      serviceAccountName: csi-azurelustre-status-controller-sa
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/controlplane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
                  - key: kubernetes.azure.com/cluster
                    operator: Exists
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.azure.com/mode
                    operator: NotIn
                    values:
                      - system
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - csi-azurelustre-status-controller
                topologyKey: topology.kubernetes.io/zone
              weight: 10
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - csi-azurelustre-status-controller
                topologyKey: kubernetes.io/hostname
              weight: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-controller
          image: mcr.microsoft.com/oss/v2/kubernetes-csi/azurelustre-csi:v0.6.0-noble
          imagePullPolicy: Always
          args:
            - --status-controller-only=true
            - -v=5
          env:
            - name: AZURELUSTRE_CSI_ROLE
              value: status-controller
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: COMPATIBILITY_POLICY_CONFIGMAP
              value: csi-azurelustre-compatibility-policy
            - name: STATUS_CONTROLLER_ELECTION_NAMESPACE
              value: azurelustre-control-f78b1d92acb5c8bd47911576df92b345
          ports:
            - name: health
              containerPort: 29654
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 1
              memory: 200Mi
            requests:
              cpu: 10m
              memory: 20Mi
