---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-azurelustre-node-sa
  namespace: kube-system
  labels:
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: v0.6.0
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-azurelustre-node-role
  labels:
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: v0.6.0
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - patch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-azurelustre-node-binding
  labels:
    app.kubernetes.io/name: azurelustre-csi-driver
    app.kubernetes.io/part-of: azurelustre-csi-driver
    app.kubernetes.io/version: v0.6.0
subjects:
  - kind: ServiceAccount
    name: csi-azurelustre-node-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-azurelustre-node-role
  apiGroup: rbac.authorization.k8s.io
