---
version: 2
updates:
  # GitHub Actions — keep workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    labels:
      - "dependencies"
      - "go"
    ignore:
      # Keep Kubernetes release-family upgrades coordinated with the Azure
      # cloud provider. Use published module versions and verify compatibility;
      # staging-module replace directives are no longer needed.
      - dependency-name: "k8s.io/*"
    groups:
      azure-sdk:
        patterns:
          - "github.com/Azure/azure-sdk-for-go/*"
          - "github.com/Azure/go-autorest/*"
        update-types:
          - "minor"
          - "patch"
      csi-libs:
        patterns:
          - "github.com/kubernetes-csi/*"
          - "github.com/container-storage-interface/*"
        update-types:
          - "minor"
          - "patch"
      golang-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "github.com/Azure/azure-sdk-for-go/*"
          - "github.com/Azure/go-autorest/*"
          - "github.com/kubernetes-csi/*"
          - "github.com/container-storage-interface/*"
