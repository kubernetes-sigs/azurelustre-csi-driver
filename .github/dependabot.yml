---
version: 2
updates:
  # GitHub Actions — keep workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 10
    ignore:
      # Keep Kubernetes release-family upgrades coordinated with the Azure
      # cloud provider. Use published module versions and verify compatibility;
      # staging-module replace directives are no longer needed.
      - dependency-name: "k8s.io/*"
      # Provider/client minor upgrades can change the Azure SDK types they share.
      - dependency-name: "sigs.k8s.io/cloud-provider-azure"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/cloud-provider-azure/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      azure-sdk:
        patterns:
          - "github.com/Azure/azure-sdk-for-go/*"
          - "github.com/Azure/go-autorest/*"
        update-types:
          - "minor"
          - "patch"
      csi-libs:
        patterns:
          - "github.com/kubernetes-csi/*"
          - "github.com/container-storage-interface/*"
        update-types:
          - "minor"
          - "patch"
      azure-cloud-provider:
        patterns:
          - "sigs.k8s.io/cloud-provider-azure"
          - "sigs.k8s.io/cloud-provider-azure/*"
        update-types:
          - "patch"
